<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Newsletter de cocina</title>
    
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;700;900&family=Lora:wght@400;600&display=swap" rel="stylesheet"> 
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Fraunces:wght@400;700;900&family=Lora:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>

    <header class="topbar">
        <a class="logo" href="#">
        <img src="logo.png" alt="Logo de Sabores del Mundo, cocinero sonriente con un batidor">
        </a>
        <nav>
            <a href="#">Inicio</a>
            <a href="#">Recetas</a>
            <a href="#">Sobre nosotros</a>
            <a href="#">Contacto</a>
        </nav>
    </header>

    <main class="hero">
        <h1>Únete a nuestra <span class="resalte">comunidad</span></h1>
        <h2>Recibe tips semanales</h2>

        <form action="#" class="form">
            <input type="email" placeholder="tu@email.com" required>
            <button type="submit">Suscribirse</button>
        </form>
        <p class="legal">
            Al suscribirte, aceptas recibir correos electrónicos de nuestra parte. 
            Puedes darte de baja en cualquier momento. Consulta nuestra política de privacidad.
        </p>

    </main>

    <footer>
        Diseñado por EVA MARTÍN CASTILLO
    </footer>

</body>
</html>
